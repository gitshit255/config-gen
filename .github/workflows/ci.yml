name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Generate JSON
        run: |
          set +e  # we check exit codes / http codes manually below

          # revanced/revanced-patches on GitHub is currently unavailable (DMCA
          # takedown, see https://github.com/ReVanced/where-is-revanced-patches),
          # so try GitHub first, then fall back to the official GitLab mirror's
          # Releases API. Every branch prints the actual HTTP status/body on
          # failure instead of letting jq fail with an opaque
          # "Cannot index string" error.

          name=""
          dl_url=""

          http_get() {
            # prints "<code>\n<body>" for the given URL
            curl -sS -L -w '\n%{http_code}' "$1"
          }

          # --- 1. GitHub -------------------------------------------------
          resp=$(http_get "https://api.github.com/repos/revanced/revanced-patches/releases/latest")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          if [ "$code" = "200" ] && echo "$body" | jq -e 'has("assets") and (.assets|length>0)' >/dev/null 2>&1; then
            name=$(echo "$body" | jq -r '.assets[0].name')
            dl_url=$(echo "$body" | jq -r '.assets[0].browser_download_url')
          else
            echo "GitHub source unavailable (HTTP $code):"
            echo "$body" | head -c 500
            echo
          fi

          # --- 2. GitLab mirror, Releases API -------------------------------
          # "permalink/latest" only guarantees the most recently *released_at*
          # release, not the one with an asset attached (some dev/pre-release
          # entries on this mirror carry no binary). So instead, scan the most
          # recent releases and use the first one that actually has an asset.
          if [ -z "$name" ]; then
            resp=$(http_get "https://gitlab.com/api/v4/projects/ReVanced%2Frevanced-patches/releases?per_page=20&order_by=released_at&sort=desc")
            code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            if [ "$code" = "200" ] && echo "$body" | jq -e 'type=="array"' >/dev/null 2>&1; then
              name=$(echo "$body" | jq -r '[.[] | select((.assets.links // []) | length > 0)][0].assets.links[0].name // empty')
              dl_url=$(echo "$body" | jq -r '[.[] | select((.assets.links // []) | length > 0)][0].assets.links[0].url // empty')
              if [ -z "$name" ]; then
                echo "GitLab: none of the last 20 releases have an asset attached:"
                echo "$body" | jq -r '.[] | "\(.tag_name): \(.assets.links | length) asset(s)"'
              fi
            else
              echo "GitLab releases API unavailable (HTTP $code):"
              echo "$body" | head -c 500
              echo
            fi
          fi

          if [ -z "$name" ] || [ -z "$dl_url" ]; then
            echo "::error::Could not resolve a patches asset from GitHub or GitLab. See log above for the raw responses."
            exit 1
          fi

          set -e

          version_name="${name%.*}"

          if [ "$version_name" = "$(cat docs/version)" ]; then exit 0; fi
          echo -n "$version_name" >docs/version

          wget "$dl_url" -O "$name"

          java -jar patches-json-gen.jar "$name" "docs/patches.json"

      - name: patches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: docs/patches.json docs/version
          commit_message: Update patches.json
