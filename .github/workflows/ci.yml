name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Generate JSON
        run: |
          set +e  # we check exit codes / http codes manually below

          # revanced/revanced-patches on GitHub is currently unavailable (DMCA
          # takedown, see https://github.com/ReVanced/where-is-revanced-patches).
          # Its GitLab mirror (gitlab.com/ReVanced/revanced-patches) only carries
          # source + changelogs -- every release there has zero binary assets,
          # confirmed by scanning its last 20 releases -- so it can't be used
          # as a download source at all.
          #
          # Fall back to anddea/revanced-patches instead: an actively maintained
          # fork with real GitHub releases and real binary assets (now published
          # as patches-*.mpp since the ecosystem's "Morphe" rebrand). Note this
          # is the "RVX/Extended" patch set, not a byte-for-byte copy of the
          # official one -- it has additional/reorganized patches -- but it's
          # the closest actively-published source while the original is down.
          #
          # Every branch prints the actual HTTP status/body on failure instead
          # of letting jq fail with an opaque "Cannot index string" error.

          name=""
          dl_url=""

          http_get() {
            # prints "<code>\n<body>" for the given URL
            curl -sS -L -w '\n%{http_code}' "$1"
          }

          # pick the first asset whose name looks like "patches-<version>.rvp"
          # (.jar for older releases, .mpp for the Morphe rebrand), ignoring
          # cli/integrations/etc assets
          pick_patches_asset() {
            jq -r '[.assets[] | select(.name | test("^patches-.*\\.(rvp|jar|mpp)$"))][0].name // empty'
          }
          pick_patches_url() {
            jq -r '[.assets[] | select(.name | test("^patches-.*\\.(rvp|jar|mpp)$"))][0].browser_download_url // empty'
          }

          # --- 1. Official GitHub repo ------------------------------------
          resp=$(http_get "https://api.github.com/repos/revanced/revanced-patches/releases/latest")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          if [ "$code" = "200" ] && echo "$body" | jq -e 'has("assets") and (.assets|length>0)' >/dev/null 2>&1; then
            name=$(echo "$body" | pick_patches_asset)
            dl_url=$(echo "$body" | pick_patches_url)
          else
            echo "Official GitHub source unavailable (HTTP $code):"
            echo "$body" | head -c 500
            echo
          fi

          # --- 2. anddea/revanced-patches fallback ------------------------
          if [ -z "$name" ]; then
            resp=$(http_get "https://api.github.com/repos/anddea/revanced-patches/releases/latest")
            code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            if [ "$code" = "200" ] && echo "$body" | jq -e 'has("assets") and (.assets|length>0)' >/dev/null 2>&1; then
              name=$(echo "$body" | pick_patches_asset)
              dl_url=$(echo "$body" | pick_patches_url)
              if [ -z "$name" ]; then
                echo "anddea/revanced-patches latest release has no patches-*.(rvp|jar|mpp) asset:"
                echo "$body" | jq -r '.assets[].name'
              else
                echo "Using anddea/revanced-patches fallback (RVX/Extended patch set) since the official repo is unavailable."
              fi
            else
              echo "anddea/revanced-patches fallback unavailable (HTTP $code):"
              echo "$body" | head -c 500
              echo
            fi
          fi

          if [ -z "$name" ] || [ -z "$dl_url" ]; then
            echo "::error::Could not resolve a patches asset from the official repo or the anddea fallback. See log above for the raw responses."
            exit 1
          fi

          set -e

          version_name="${name%.*}"

          if [ "$version_name" = "$(cat docs/version)" ]; then exit 0; fi
          echo -n "$version_name" >docs/version

          wget "$dl_url" -O "$name"

          echo "Running patches-json-gen.jar against $name ..."
          if ! java -jar patches-json-gen.jar "$name" "docs/patches.json"; then
            echo "::error::patches-json-gen.jar failed to process '$name'. If this file is a Morphe-format .mpp bundle, it may not be readable by this (ReVanced-era) generator -- see the Java error above for details."
            exit 1
          fi

      - name: patches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: docs/patches.json docs/version
          commit_message: Update patches.json
