name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Generate JSON
        run: |
          # revanced/revanced-patches on GitHub is currently unavailable (DMCA
          # takedown, see https://github.com/ReVanced/where-is-revanced-patches),
          # so try GitHub first and fall back to the official GitLab mirror.
          name=""
          dl_url=""

          gh_resp=$(curl -sf https://api.github.com/repos/revanced/revanced-patches/releases/latest) && \
            gh_name=$(echo "$gh_resp" | jq -r '.assets[0].name // empty') && \
            [ -n "$gh_name" ] && {
              name="$gh_name"
              dl_url=$(echo "$gh_resp" | jq -r '.assets[0].browser_download_url')
            }

          if [ -z "$name" ]; then
            echo "GitHub source unavailable, falling back to GitLab mirror"
            gl_resp=$(curl -sf "https://gitlab.com/api/v4/projects/ReVanced%2Frevanced-patches/releases/permalink/latest") || exit 1
            name=$(echo "$gl_resp" | jq -r '.assets.links[0].name // empty')
            dl_url=$(echo "$gl_resp" | jq -r '.assets.links[0].url // empty')
            if [ -z "$name" ] || [ -z "$dl_url" ]; then
              echo "Could not resolve a patches asset from either source" >&2
              exit 1
            fi
          fi

          version_name="${name%.*}"

          if [ "$version_name" = "$(cat docs/version)" ]; then exit 0; fi
          echo -n "$version_name" >docs/version

          wget "$dl_url" -O "$name"

          java -jar patches-json-gen.jar "$name" "docs/patches.json"

      - name: patches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: docs/patches.json docs/version
          commit_message: Update patches.json
